name: Apply strict source fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-strict-source-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          game = Path('src/engine/game.ts')
          s = game.read_text()
          old = '  const seatIdx = next.currentSeat;\n'
          new = '  const seatIdx: number = state.currentSeat;\n'
          if old not in s:
              raise SystemExit('game.ts target not found')
          game.write_text(s.replace(old, new, 1))

          lobby = Path('src/hooks/useLobby.ts')
          s = lobby.read_text()
          targets = [
              (
                  'export function useLobby(code: string | undefined, isHostCreate?: CreateOptions) {',
                  "export function useLobby(code: string = '', isHostCreate?: CreateOptions) {",
              ),
              (
                  '    const nextSeats = (seatsResult.data ?? []).map(mapSeat);',
                  '    const nextSeats: LobbySeatMeta[] = (seatsResult.data ?? []).map(mapSeat);',
              ),
          ]
          for old, new in targets:
              if old not in s:
                  raise SystemExit(f'useLobby.ts target not found: {old}')
              s = s.replace(old, new, 1)
          lobby.write_text(s)
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/game.ts src/hooks/useLobby.ts
          git commit -m "Fix strict TypeScript build errors"
          git push
